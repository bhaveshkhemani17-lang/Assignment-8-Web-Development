<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 500px;
            background-color: burlywood;
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: space-evenly;
        }
        .box{
            height: 100px;
            width: 100px;
            border-radius: 10px;
            border: 1px solid black;
            color: white;
            text-align: center;
            line-height: 100px;
        }
        .sb{
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .b1{
            background-color: red;
            animation-name: color;
            animation-duration: 3s;
            animation-iteration-count: infinite;
        }
        @keyframes color {
            from{
                background-color: red;
            }
            to{
                background-color: blue;
            }
        }
        .b2{
            background-color: blueviolet;
            animation-name: move;
            animation-duration: 3s;
            animation-iteration-count: infinite; 
        }
        @keyframes move {
            0%{
                transform: translate(0);
            }
            50%{
                transform: translate(0,50px);
            }
            100%{
                transform: translate(0);
            }
        }
        .b3{
            background-color: darkgreen;
            animation-name: rotate;
            animation-duration: 3s;
            animation-iteration-count: infinite; 
        }
        @keyframes rotate {
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .b4{
            background-color: orange;
            animation-name: pulse;
            animation-duration: 3s;
            animation-iteration-count: infinite; 
        }
        @keyframes  pulse{
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.5);
            }
            100%{
                transform: scale(1);
            }
        }
        .b5{
            background-color: gray;
            animation-name: fade;
            animation-duration: 3s;
            animation-iteration-count: infinite; 
        }
        @keyframes  fade{
            0%{
                opacity: 1;
            }
            50%{
                opacity: 0;
            }
            100%{
                opacity: 1;
            }
        }
        .b6{
            border-radius: 50%;
            border: 10px solid white;
            border-top: 10px solid blue;
            animation-name: spin;
            animation-duration: 3s;
            animation-iteration-count: infinite; 
        }
        @keyframes spin {
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .big-box {
            height: 300px;
            width: 300px;
            border: 2px dashed black;
            overflow: hidden;
        }
        .b7 {
            height: 80px;
            width: 80px;
            background-color: green;
            animation: walk-box 3s ease-in-out infinite;
        }

        @keyframes walk-box {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(220px, 0px); }
            50% { transform: translate(220px, 220px); }
            75% { transform: translate(0px, 220px); }
            100% { transform: translate(0px, 0px); }
        }

        .google {
            display: flex;
            gap: 5px;
        }
        .dot {
            border-radius: 50%;
            height: 30px;
            width: 30px;
            animation: jiggle 0.4s cubic-bezier(1, 0.35, 0.65, 1) infinite;
        }
        .box2 {
            display: flex;
            gap: 50px;
        }
        .g {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes jiggle {
            0% { transform: translateY(0px);}
            25% { transform: translateY(-6px);}
            50% { transform: translateY(0px);}
            75% { transform: translateY(6px);}
            100% { transform: translateY(0px);}
        }
        </style>
</head>
<body>
    <h1 align="center">CSS Animation</h1>
    <div class="con">
        <div class="sb">
        <div class="box b1">Color</div>
        <div class="box b2">Move</div>
        <div class="box b3">Rotate</div>
        <div class="box b4">Pulse</div>
        <div class="box b5">Fade</div>
        <div class="box b6">spin</div>
        </div>
        <div class="box2">
            <div class="big-box">
                <div class="b7"></div>
            </div>
            <div class="big-box g">
                <div class="google">
                    <div class="dot" style="background-color: red; animation-delay: 0.1s;"></div>
                    <div class="dot" style="background-color: yellow; animation-delay: 0.2s"></div>
                    <div class="dot" style="background-color: orange; animation-delay: 0.3s"></div>
                    <div class="dot" style="background-color: green; animation-delay: 0.4s"></div>
                    <div class="dot" style="background-color: blue; animation-delay: 0.5s"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
